name: Atualizar dados Garmin

on:
  schedule:
    - cron: '0 7 * * *'   # todo dia às 07:00 UTC (04:00 BRT)
  workflow_dispatch:        # permite disparar manualmente pelo GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: pip install garminconnect httpx

      # ── 3. Exportar dados do Garmin ──────────────────────────────────────
      - name: Exportar dados Garmin
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python garmin_export_v2.py \
            --start 2026-01-01 \
            --end $(date +%Y-%m-%d) \
            --output garmin_vue/public/garmin_data.json

      # ── 4. Commit + push (Vercel detecta e faz o deploy) ─────────────────
      - name: Commit e push do JSON atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garmin_vue/public/garmin_data.json
          git diff --cached --quiet || git commit -m "data: atualização automática Garmin $(date +%Y-%m-%d)"
          git push


